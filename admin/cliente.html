<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cliente · Panel · Punto POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/app.css" />
<script src="../vendor/tailwind.js"></script>
<script src="../js/tw.js"></script>
</head>
<body data-shell="admin" data-page="clientes" data-title="Cliente">

<main data-page="clientes" class="view reveal" style="--i:0">
  <div class="view__head">
    <div>
      <p class="label" id="f-modo">Nuevo</p>
      <h2 id="f-titulo">Cliente</h2>
      <p class="view__sub" id="f-sub">Aparece en las boletas y en el historial de compras.</p>
    </div>
    <a class="btn" href="clientes.html" id="f-volver">Volver a clientes</a>
  </div>

  <form id="form-cliente" novalidate>
    <input type="hidden" name="registro" />
    <div class="panel">
      <div class="panel__head"><h3 id="f-panel">Datos del cliente</h3></div>
      <div class="panel__body form-grid">
        <div class="field span-2">
          <label class="field__label" for="cl-nombre">Nombre o razón social</label>
          <input class="input" id="cl-nombre" name="nombre" placeholder="Camila Rojas" />
          <p class="field__help" data-hint="Como figura en la boleta.">Como figura en la boleta.</p>
        </div>
        <div class="field">
          <label class="field__label" for="cl-rut">RUT</label>
          <input class="input mono" id="cl-rut" name="rut" placeholder="12.345.678-9" />
          <p class="field__help" data-hint="Formato 12.345.678-9.">Formato 12.345.678-9.</p>
        </div>
        <div class="field">
          <label class="field__label" for="cl-telefono">Teléfono</label>
          <input class="input" id="cl-telefono" name="telefono" placeholder="9 8123 4567" />
          <p class="field__help" data-hint="Opcional.">Opcional.</p>
        </div>
        <div class="field span-2">
          <label class="field__label" for="cl-email">Correo</label>
          <input class="input" id="cl-email" name="email" type="email" placeholder="nombre@correo.cl" />
          <p class="field__help" data-hint="Opcional.">Opcional.</p>
        </div>
      </div>
    </div>

    <div class="form-actions" id="f-acciones">
      <a class="btn" href="clientes.html" id="f-cancelar">Cancelar</a>
      <a class="btn btn--primary" href="clientes.html" id="f-editar" hidden>Editar cliente</a>
      <button class="btn btn--primary" type="submit" id="f-guardar">Guardar cliente</button>
    </div>
  </form>
</main>

<script src="../js/store.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/cliente.js"></script>
</body>
</html>
